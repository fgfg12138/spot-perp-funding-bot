name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "release/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit -p tsconfig.ci.json

      - name: I18N lint
        run: npm run lint:i18n

      - name: Unit tests
        run: npx vitest run lib/strategy-v121

      - name: Production build
        run: npm run build
